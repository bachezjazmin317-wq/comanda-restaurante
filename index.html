<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comanda de Alimentos</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f2f2f2;
      color: #222;
    }

    header {
      background: #222;
      color: white;
      text-align: center;
      padding: 25px 10px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
    }

    .contenedor {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .tarjeta {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #0002;
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
      border-bottom: 2px solid #222;
      padding-bottom: 10px;
    }

    .datos {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }

    input, textarea, select {
      width: 100%;
      padding: 11px;
      border: 1px solid #aaa;
      border-radius: 6px;
      font-size: 15px;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .producto {
      display: grid;
      grid-template-columns: 80px 1fr 120px 120px;
      gap: 10px;
      align-items: end;
      margin-bottom: 12px;
    }

    button {
      border: 0;
      padding: 12px 18px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .agregar {
      background: #222;
      color: white;
      margin-top: 10px;
    }

    .enviar {
      background: #333;
      color: white;
      width: 100%;
      font-size: 17px;
      margin-top: 20px;
    }

    .eliminar {
      background: #ddd;
    }

    .total {
      text-align: right;
      font-size: 20px;
      font-weight: bold;
      margin-top: 20px;
    }

    @media (max-width: 650px) {
      .datos {
        grid-template-columns: 1fr;
      }

      .producto {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>ENCANTO DE LUNA</h1>
  <p>Sistema de Comandas</p>
</header>

<div class="contenedor">

  <div class="tarjeta">
    <h2>Comanda de alimentos</h2>

    <div class="datos">
      <div>
        <label>N.º de clientes</label>
        <input type="text" id="numero" placeholder="Ej. 001">
      </div>

      <div>
        <label>Mesa</label>
        <input type="number" id="mesa" placeholder="Ej. 5">
      </div>

      <div>
        <label>Fecha</label>
        <input type="date" id="fecha">
      </div>

      <div>
        <label>Mesero</label>
        <input type="text" id="mesero" placeholder="Nombre del mesero">
      </div>
    </div>
  </div>

  <div class="tarjeta">
    <h2>Productos</h2>

    <div id="productos">

      <div class="producto">
        <div>
          <label>Cantidad</label>
          <input type="number" class="cantidad" value="1" min="1">
        </div>

        <div>
          <label>Descripción</label>
          <input type="text" class="descripcion" placeholder="Nombre del alimento">
        </div>

        <div>
  <label>Área</label>
  <select class="area">
    <option value="cocina">Cocina</option>
    <option value="bar">Bar</option>
  </select>
</div>

  <div>      
        <label>Precio</label>
          <input type="number" class="precio" step="0.01" placeholder="0.00">
        </div>

        <div>
          <button class="eliminar" onclick="eliminarProducto(this)">
            Eliminar
          </button>
        </div>
      </div>

    </div>

    <button class="agregar" onclick="agregarProducto()">
      + Agregar alimento
    </button>

    <div class="total">
      Total: $<span id="total">0.00</span>
    </div>
  </div>

  <div class="tarjeta">
    <h2>Observaciones</h2>

    <textarea id="observaciones"
      placeholder="Ej. Sin cebolla, término medio, etc."></textarea>

    <button class="enviar" onclick="enviarComanda()">
      ENVIAR COMANDA
    </button>
  </div>

</div>

<script>

function agregarProducto() {

  const contenedor = document.getElementById("productos");

  const producto = document.createElement("div");

  producto.className = "producto";

  producto.innerHTML = `
    <div>
      <input type="number" class="cantidad" value="1" min="1">
    </div>

    <div>
      <input type="text" class="descripcion"
      placeholder="Nombre del alimento">
    </div>

    <div>
      <input type="number" class="precio"
      step="0.01" placeholder="0.00">
    </div>

    <div>
    <div>
  <input type="number" class="precio"
  step="0.01" placeholder="0.00">
</div>

<div>
  <select class="area">
    <option value="cocina">Cocina</option>
    <option value="bar">Bar</option>
  </select>
</div>

<div>
      <button class="eliminar"
      onclick="eliminarProducto(this)">
      Eliminar
      </button>
    </div>
  `;

  contenedor.appendChild(producto);
}

function eliminarProducto(boton) {
  boton.parentElement.parentElement.remove();
  calcularTotal();
}

document.addEventListener("input", function(e) {

  if (
    e.target.classList.contains("cantidad") ||
    e.target.classList.contains("precio")
  ) {
    calcularTotal();
  }

});

function calcularTotal() {

  let total = 0;

  const productos = document.querySelectorAll(".producto");

  productos.forEach(producto => {

    const cantidad =
      Number(producto.querySelector(".cantidad").value) || 0;

    const precio =
      Number(producto.querySelector(".precio").value) || 0;

    total += cantidad * precio;

  });

  document.getElementById("total").textContent =
    total.toFixed(2);
}

function enviarComanda() {
    const numero = document.getElementById("numero").value;
    const mesa = document.getElementById("mesa").value;
    const fecha = document.getElementById("fecha").value;
    const mesero = document.getElementById("mesero").value;
    const observaciones = document.getElementById("observaciones").value;

   const filas = document.querySelectorAll("#productos .producto");
    const productos = [];

    filas.forEach(fila => {
        filas.forEach(fila => {
    const cantidad = fila.querySelector(".cantidad").value;
    const descripcion = fila.querySelector(".descripcion").value;
    const precio = fila.querySelector(".precio").value;
    const total = fila.querySelector(".total").textContent;
    const area = fila.querySelector(".area").value;
      
    if (descripcion.trim() !== "") {
        productos.push({
           cantidad: cantidad,
           descripcion: descripcion,
           precio: precio,
           total: total,
            area: area   
            });
        }
    });

    const totalComanda = productos.reduce(
        (suma, producto) => suma + parseFloat(producto.total || 0),
        0
    );

    db.ref("comandas").push({
        numero: numero,
        mesa: mesa,
        fecha: fecha,
        mesero: mesero,
        productos: productos,
        observaciones: observaciones,
        total: totalComanda,
        estado: "nueva",
        creada: firebase.database.ServerValue.TIMESTAMP
    })
    .then(() => {
        alert("✅ Comanda enviada correctamente a Cocina");
    })
    .catch((error) => {
        alert("❌ Error al enviar la comanda: " + error.message);
    });

}

</script>

</script>
</body>
</html>
